<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- CreditReportSpace emits OOXML runs using Windows' Traditional Chinese
       標楷體/DFKai-SB. Map those names to the pinned Debian UKai face so
       headless LibreOffice renders Traditional Chinese deterministically. -->
  <alias>
    <family>標楷體</family>
    <prefer>
      <family>AR PL UKai TW</family>
    </prefer>
  </alias>
  <alias>
    <family>DFKai-SB</family>
    <prefer>
      <family>AR PL UKai TW</family>
    </prefer>
  </alias>
</fontconfig>

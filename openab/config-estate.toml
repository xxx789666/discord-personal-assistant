# OpenAB config — 不動產估價 bridge（#不動產估價，實價登錄比價估價）
#
# 殼與 nvidia-lab 相同：qwen-code（`qwen --acp`）→ NVIDIA NIM 免費端點。
# 沿用 nvidia-bridge 這個 bot 應用（同一個 DISCORD_TOKEN_NVIDIA）作第三個
# 容器 —— 與 openab-nvidia-lab / openab-travel-nvidia 是同一 token、不同容器、
# allowed_channels 互斥，所以三個容器不會互相重複回覆。
# （bot 在頻道顯示名仍是 Nvidia-bridge；要獨立名稱再開新 Discord 應用換 token。）
#
# 角色：估價助理。標示部由使用者人工提供（pqt 地政電傳付費且禁自動化），
# bot 只做「內政部實價登錄 open data 比價 + 估價計算」。SOP 見
# EstateSpace/AGENTS.md，工具用法見 EstateSpace/WebAccess.md。

[discord]
bot_token = "${DISCORD_TOKEN_NVIDIA}"
allowed_channels = [
  "1517804694901362752",  # #不動產估價（AA-agent 伺服器，2026-06-20 API 建立）
]
# 私訊免 @ ＋ 使用者白名單 — 同其他 bridges。
allow_dm = true
allowed_users = [
  "843428445802725388",   # anxxxiii（owner）
  "1488170559865884684",  # qmini20
]

[agent]
# 2026-08-09 從 qwen-code→NIM 改為 kiro-cli（OpenAB 官方預設後端，原生 ACP）。
# 換的理由是**規則遵守**不是速度 —— 見下方實測紀錄。
command = "kiro-cli"
args = ["acp", "--trust-all-tools"]
# EstateSpace 是唯一掛載的工作區（docker-compose.yml）。AGENTS.md 定義角色與
# 估價 SOP，WebAccess.md 是 tools/*.py 用法。QWEN.md 是 qwen 時代的轉指檔，
# kiro 不讀它，AGENTS.md 本來就在根目錄會被自動讀入。
working_dir = "/workspace/EstateSpace"
# GROQ_API_KEY 給 [stt] 語音轉文字用（agent 子行程本身用不到，但保持與其他
# bridge 一致）。NIM 的 OPENAI_* 三件套已移除 —— kiro-cli 走 AWS Builder ID，
# 認證在 aiquant_kiro_auth volume，不吃 NVIDIA key。
env = { GROQ_API_KEY = "${GROQ_API_KEY}" }
#
# ── 為什麼離開 NIM：2026-08-09 三個模型的實測 ──────────────────────
#   模型            單回合benchmark      實測整輪（同一個估價標的）
#   minimax-m3      4.2s  工具 4/4      7分10秒、9 次 shell、11 條規則全過
#   gpt-oss-20b     2.25s 工具 4/4      11 秒、2 次 shell、跳過大半 SOP
#   gpt-oss-120b    3.2s  工具 3/4      11 秒、2 次 shell、同樣跳過
#
# 兩個 gpt-oss 都只跑 lvr.py 就下結論：沒查同棟建案名與成交錨點、沒跑
# listing.py、沒問坪數歧義、沒比對各站坪數落差，然後拿「整區中位數」
# （AGENTS.md 明文標為不參與計算）乘坪數算出估價數字。120b 還自稱「符合
# SOP 取最接近的數筆」，實際用的是全部 28 筆的中位數。
#
# 教訓：**單回合 benchmark 完全預測不了八回合的表現**。minimax 慢但會照
# SOP 一步步查；快 40 倍的代價是不做事。瓶頸從來是規則遵守，不是速度。
# kiro-cli 是 Claude 系＋OpenAB 官方預設後端，KIRO_SETUP.md 記載一次查證
# 約 50–90 秒、0.05–0.2 AWS credits（估價一輪較重，抓 0.2–0.5）。
# 要退回免費 NIM：command="qwen"、args=["--acp"]、env 加回 OPENAI_* 三件套
# （OPENAI_MODEL 用 minimaxai/minimax-m3，那是唯一驗證過全部規則的 NIM 模型）。
# 註：moonshotai/kimi-k2.6 仍列在 /v1/models 但實際呼叫回 404，不可用。

[pool]
# 同 nvidia-lab：max_sessions=1 時主頻道與討論串會搶唯一槽位而靜默無回應。
max_sessions = 2
session_ttl_hours = 2

[reactions]
enabled = true
remove_after_reply = false
# 工具呼叫顯示（docs/tool-display.md，0.8.4 起支援）：full | compact | none
# 估價一輪要跑 8~9 次 shell，full 會把每一行 `uv run tools/lvr.py --city …`
# 都印進 Discord，回覆看起來很雜。改 compact 只留一行計數。
# 注意：這只管「工具行」，agent 自己的敘述文字（「我先查同棟…」）不受影響 ——
# 那是 assistant text，openab 沒有過濾設定（2026-08-07 查證 config-reference）。
tool_display = "compact"

# 語音訊息轉文字 — 同其他 bridges 的 Groq whisper 設定。
[stt]
enabled = true
api_key = "${GROQ_API_KEY}"
model = "whisper-large-v3-turbo"
base_url = "https://api.groq.com/openai/v1"
echo_transcript = true

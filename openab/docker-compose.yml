# Discord 個人助理 compose stack — 2026-06-12 自 D:\AIQuant\openab 獨立出來，
# 與 quant stack 完全分離（不同 compose 專案、不同網路、不同 .local）。
#
# 服務：
#   openab-kiro          #kiro-assistant（Kiro CLI，通用助理＋旅遊查證主力）
#   openab-nvidia-lab    #nvidia-lab（qwen-code → NVIDIA NIM，實驗/免費勞力）
#   openab-url-intake    #url-intake（網址／影片 → Obsidian Markdown）
#   openab-travel-nvidia #travel-planner 查證副手（同上殼）
#   openab-travel-claude #travel-planner 行程彙整（Claude Max OAuth）
#   openab-credit-report #聯徵報告製作（Codex CLI；PDF/圖片進、DOCX 回傳）
#   steel-api / steel-ui 瀏覽器沙箱（讀網頁）＋ live viewer
#   searxng              metasearch JSON API（搜尋）
#
# 機密在 ../.local/*.env（gitignore）。與 AIQuant 僅剩的依賴：
#   - base image openab-codex:with-uv（Dockerfile.nvidia 的 FROM，quant 那邊
#     build 的；若被刪，照 AIQuant openab/Dockerfile.codex.ext 重建）
#   - Claude OAuth 掛載 C:/Users/xx/.claude（host 層級，非 AIQuant）
#
# Named volumes 沿用 aiquant_* 舊名（歷史包袱，改名會丟 Kiro AWS 登入與
# Steel cookies — 不值得）。全部 external：搬到新機器要先 docker volume create。
name: discord-assistant

services:
  # ─────────────────────────────────────────────────────────────────────────
  # #kiro-assistant — Kiro CLI（原生 ACP）。設定手冊 KIRO_SETUP.md。
  openab-kiro:
    # 衍生 image（2026-06-12）：上游 openab 預設 image（digest 釘在
    # Dockerfile.kiro 的 FROM）+ python3/ffmpeg/yt-dlp/youtube-transcript-api
    # — 給 KiroSpace/tools/yt.py 做 YouTube 逐字稿（同 quant intake 能力）。
    image: openab-kiro:tools
    build:
      context: .
      dockerfile: Dockerfile.kiro
    container_name: openab-kiro
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/groq.env          # GROQ_API_KEY — [stt] 語音轉文字
    volumes:
      - "D:/discord 個人助理/KiroSpace:/workspace/KiroSpace"
      # 旅遊 vault：Kiro 是旅遊查證主力，成果寫 Trips/<slug>/research_notes.md
      # （KiroSpace/AGENTS.md §跨頻道 + .kiro/steering/travel/）。
      - "D:/discord 個人助理/TravelMemory:/workspace/TravelMemory"
      # Kiro 狀態 + AWS Builder ID 憑證（device-flow 登入過；down -v 會丟）。
      - aiquant_kiro_state:/home/agent/.kiro
      - aiquant_kiro_auth:/home/agent/.local/share/kiro-cli
      - ./config-kiro.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/KiroSpace >/dev/null 2>&1 && ls /workspace/TravelMemory >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # #nvidia-lab — qwen-code 殼 → NVIDIA NIM 免費模型。設定手冊 NVIDIA_SETUP.md。
  # 歷史：codex-acp 殼因 codex 移除 chat API 而不可用（NVIDIA_SETUP §7）。
  openab-nvidia-lab:
    image: openab-nvidia:qwen
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    container_name: openab-nvidia-lab
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/nvidia.env        # NVIDIA_API_KEY
      - ../.local/groq.env
    volumes:
      - "D:/discord 個人助理/LabSpace:/workspace/LabSpace"
      # qwen 狀態（含 output-language.md 強制繁中 — NVIDIA_SETUP §7 坑 2；
      # 新 volume 要 chown 1000:1000 — NVIDIA_SETUP §4）。
      - aiquant_nvidialab_qwen_state:/home/node/.qwen
      - ./config-nvidia-lab.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/LabSpace >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # #url-intake — 每則 URL 自動擷取與整理。專用 py-cord listener 直接監聽
  # 頻道（無需 @）；擷取沿用 quant-intake 的字幕優先、yt-dlp+Whisper 退路，
  # 一般網頁走 Steel/Jina，再由 NVIDIA NIM 整理。Markdown 寫入 Obsidian
  # vault 的 URLIntake/，PDF 由下方 intake-publisher 確定性回傳。
  openab-url-intake:
    image: assistant-url-intake:dev
    build:
      context: ./url-intake
      dockerfile: Dockerfile
    container_name: openab-url-intake
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/nvidia.env
      - ../.local/groq.env
      - ../.local/cloudflare.env
      # DECLARED_UA_CONTACT：SEC.gov 要求自動化工具表明聯絡方式。放在 .local
      # 而非這裡，因為這個 repo 是公開的（範本 .local/intake.env.example）。
      - ../.local/intake.env
    environment:
      CHANNEL_ID: "1536220007657373806"
      ALLOWED_USERS: "843428445802725388,1488170559865884684"
      VAULT: "/vault"
      STEEL: "http://steel-api:3000"
      NVIDIA_MODEL: "google/gemma-4-31b-it"
      # 2026-09-13：minimax-m3 於 2026-09-09 EOL（HTTP 410，已從 /v1/models 消失）；
      # 第三次 NIM 無預警下架（前兩次 kimi-k2.6、nemotron-3-nano）。
      # 2026-09-14：gemma 改打頭。MAX_SOURCE_CHARS 拉到 180000 後實測 gpt-oss 在
      # 180k 只有 1/3 合法且平均 102.3s（timeout 120），gemma 3/3、69.2s。
      # 這裡的值會蓋掉 bot.py 的預設值——改模型時兩邊都要動，否則只改 bot.py
      # 等於沒改（09-07 就是這樣才發現的）。測試會強制兩邊一致。
      NVIDIA_FALLBACK_MODEL: "openai/gpt-oss-20b"
      NVIDIA_FINAL_FALLBACK_MODEL: "nvidia/nemotron-3-super-120b-a12b"
      NVIDIA_PRIMARY_TIMEOUT: "120"
      NVIDIA_FALLBACK_TIMEOUT: "180"
      NVIDIA_FINAL_FALLBACK_TIMEOUT: "120"
      # Kitesurf/Jina only by default; local Steel is not used for webpage intake.
      ALLOW_STEEL_FALLBACK: "false"
    volumes:
      - "D:/discord 個人助理/URLIntake:/vault"
    depends_on:
      - searxng
    # python:3.12-slim 沒有 pgrep；2026-08-27 docker top / /proc/1/cmdline
    # 實測 PID 1 = python -u /app/bot.py
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '/app/bot.py' /proc/1/cmdline && ls /vault >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openab-travel-nvidia:
    image: openab-nvidia:qwen
    container_name: openab-travel-nvidia
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/nvidia.env
      - ../.local/groq.env
    volumes:
      - "D:/discord 個人助理/TravelMemory:/workspace/TravelMemory"
      - aiquant_travelnvidia_qwen_state:/home/node/.qwen
      - ./config-travel-nvidia.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/TravelMemory >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # #不動產估價 — qwen-code 殼 → NVIDIA NIM（2026-06-20）。第三個共用
  # nvidia-bridge token 的容器（allowed_channels 與另兩個互斥）。角色：實價
  # 登錄 open data 比價估價；標示部由使用者人工貼（不碰付費的 pqt 地政電傳）。
  # SOP 見 EstateSpace/AGENTS.md。新 qwen state volume 首次啟動前需 chown
  # 1000:1000（坑 2），並 docker cp 繁中 output-language.md（坑 4）。
  # 2026-08-09 後端從 qwen-code→NIM 改為 kiro-cli（見 config-estate.toml 的
  # 實測紀錄：兩個 gpt-oss 都跳過 SOP，minimax 守規則但一輪 7 分鐘）。
  # 用 openab-kiro:tools（同 #kiro-assistant 的 image，2026-08-09 加裝 uv —
  # EstateSpace 的工具全走 `uv run`）。認證 volume **刻意不共用 kiro 頻道的
  # aiquant_kiro_auth**：一來兩個容器同時 refresh AWS token 有競態，
  # 二來那是 AIQuant 的 volume，共掛會加深跨系統耦合。改用自己的一組，
  # 首次啟動要各別做 device-flow 登入（見 ESTATE_SETUP.md）。
  openab-estate:
    image: openab-kiro:tools
    container_name: openab-estate
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/groq.env
    volumes:
      - "D:/discord 個人助理/EstateSpace:/workspace/EstateSpace"
      - assistant_estate_kiro_state:/home/agent/.kiro
      - assistant_estate_kiro_auth:/home/agent/.local/share/kiro-cli
      - ./config-estate.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/EstateSpace >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # #travel-planner 彙整 — Claude Code，用「獨立的 Pro 帳號」（2026-06-12 改）：
  # 不再共用 host ~/.claude（那是 quant 用的 Max 帳號），改掛專屬 named
  # volume，容器內 `claude` 登入流程寫入 OAuth state（會自動 refresh）。
  # 重登方式：docker exec -it openab-travel-claude claude → /login。
  # 硬規則不變：絕不設 ANTHROPIC_API_KEY（Claude Code 會棄 OAuth 改走 API 計費）。
  openab-travel-claude:
    # Pinned digest of ghcr.io/openabdev/openab-claude:latest as of 2026-05-15.
    image: ghcr.io/openabdev/openab-claude@sha256:3d2017efbf1ab9702a9e3e7eaccb50e1147488cad04517ba50f29f63fd07d0ab
    container_name: openab-travel-claude
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/groq.env
      # 長效訂閱 token（2026-08-23）。目前檔內是佔位字串，等 setup-token
      # 產生後才會生效；掛著不影響現行的 .credentials.json 流程。
      - ../.local/claude_oauth.env
    volumes:
      - "D:/discord 個人助理/TravelMemory:/workspace/TravelMemory"
      # 專屬 Claude 帳號 state（rw — OAuth token 要能自動 refresh）。
      # down -v 不會清（external）；真要換帳號就重跑 /login。
      - assistant_travelclaude_state:/home/node/.claude
      - ./config-travel-claude.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/TravelMemory >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # #a-struct — Claude Code，A_struct 夜盤閘門法審核（2026-06-23）。
  # 推送由 lab 端 Astruct_daily.py(webhook) 負責；本 bot 只做自然語言審核：
  # 讀 forward/Astruct_queue.csv、append forward/Astruct_decisions.csv（AGENTS.md）。
  # forward/ = lab 的 data/forward 掛進來（巢狀 bind mount）。專屬 Claude
  # state volume，首次啟動需 docker exec -it openab-astruct claude → /login。
  openab-astruct:
    image: ghcr.io/openabdev/openab-claude@sha256:3d2017efbf1ab9702a9e3e7eaccb50e1147488cad04517ba50f29f63fd07d0ab
    container_name: openab-astruct
    restart: unless-stopped
    # TZ=Asia/Taipei（2026-06-25）：容器預設 UTC 會讓 bot 寫進 decisions.csv 的
    # ts 比實際早 8h（偽裝遲到的審核成早就決定）。固定台北時，與 lab/VPS 全一致。
    environment:
      - TZ=Asia/Taipei
    env_file:
      - ../.local/discord_token.env
      - ../.local/groq.env
      # 長效訂閱 token — 見 openab-travel-claude 同段註解。
      - ../.local/claude_oauth.env
    volumes:
      - "D:/discord 個人助理/AStructSpace:/workspace/AStructSpace"
      - "C:/Users/xx/Desktop/tmf-strategy-lab-main/tmf-strategy-lab-main/data/forward:/workspace/AStructSpace/forward"
      - assistant_astruct_state:/home/node/.claude
      - ./config-astruct.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/AStructSpace >/dev/null 2>&1 && ls /workspace/AStructSpace/forward >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # #聯徵報告製作 — 真實 Codex CLI 後端。OpenAB 以 codex-acp（不是不存在的
  # `codex --acp`）連 Codex app-server；專用 parent AGENTS.md 負責用
  # sender_context 回抓 Discord 的 PDF/圖片附件，再把最終 DOCX 上傳原 thread。
  #
  # 預設 profile 關閉，避免尚未 bootstrap token/channel/auth 時，平常整包
  # `docker compose up -d` 讓服務反覆失敗。部署見 CREDIT_REPORT_SETUP.md。
  openab-credit-report:
    profiles: ["credit-report"]
    image: assistant-credit-report-codex:dev
    build:
      context: .
      dockerfile: Dockerfile.credit-report
    container_name: openab-credit-report
    restart: unless-stopped
    env_file:
      # required:false 讓離線 `docker compose config` 與其他 profiles 維持可用；
      # 真正啟動前 bootstrap 必須建立此 gitignored 檔案。
      - path: ../.local/credit_report.env
        required: false
    environment:
      - CREDIT_REPORT_WORKSPACE=/workspace/CreditReportSpace
      - CREDIT_REPORT_INTAKE_ROOT=/workspace/CreditReportSpace/tmp/docs/intake
      - CREDIT_REPORT_MAX_ATTACHMENT_BYTES=26214400
      - CREDIT_REPORT_MAX_TOTAL_BYTES=104857600
      - CREDIT_REPORT_MAX_ATTACHMENTS=20
      - CREDIT_REPORT_MAX_OUTPUT_BYTES=26214400
    volumes:
      - "D:/discord 個人助理/CreditReportSpace:/workspace/CreditReportSpace"
      # 專用 ChatGPT/Codex OAuth state；不與 AIQuant 或其他服務共用。
      # 新 volume 預設 root-owned，首次 device auth 前依 SETUP chown 1000:1000。
      - assistant_creditreport_codex_state:/home/node/.codex
      - ./config-credit-report.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x openab >/dev/null && ls /workspace/CreditReportSpace >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # Steel Browser — agent 讀網頁用的瀏覽器沙箱。設定手冊 STEEL_SETUP.md。
  # SECURITY：所有 host port 僅綁 127.0.0.1，禁止外露/轉發（同全域 9222 政策）。
  steel-api:
    # Pinned digest of ghcr.io/steel-dev/steel-browser-api:latest, 2026-06-12.
    image: ghcr.io/steel-dev/steel-browser-api@sha256:6b65d776e17950c804c92fa49b66b5b1a335e997786fbc2a80cc11cdd650982e
    container_name: steel-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # REST API
      - "127.0.0.1:9223:9223"   # CDP — loopback only, NEVER expose
    volumes:
      - aiquant_steel_logs:/data/logs
      - aiquant_steel_exports:/tmp/steel-browser-exports
      - aiquant_steel_cache:/app/.cache   # Chrome cookies/登入態
    environment:
      - DOMAIN=localhost:3000
      - CDP_DOMAIN=localhost:9223
      - LOG_STORAGE_ENABLED=true
      - LOG_STORAGE_PATH=/data/logs/browser-logs.duckdb
      # WORKAROUND（2026-06-12）：上游 fingerprint bug（steel#294/#295/#302）
      # 致 Chrome 啟動全滅；此旗標停用反偵測層（搜尋引擎因此會擋 — 搜尋
      # 已改走 searxng）。上游修復後移除＋換 digest。
      - SKIP_FINGERPRINT_INJECTION=true

  steel-ui:
    # Pinned digest of ghcr.io/steel-dev/steel-browser-ui:latest, 2026-06-12.
    image: ghcr.io/steel-dev/steel-browser-ui@sha256:d356f19d0dba3297f5b3a3d431650477b20e3fe95be8b201092eda2af41e624b
    container_name: steel-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"     # live viewer（登入態任務的人工介入窗口）
    environment:
      - API_URL=http://localhost:3000   # UI 跑在 host 瀏覽器，走 host 口
    depends_on:
      - steel-api

  # ─────────────────────────────────────────────────────────────────────────
  # SearXNG — 搜尋 JSON API（搜尋引擎結果頁會擋 headless，故自架）。
  searxng:
    # Pinned digest of searxng/searxng:latest as of 2026-06-12.
    image: searxng/searxng@sha256:2008614c3dfba2baf7971503a8680a9799c59b144a3d9675b5f985d68917472b
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"   # 人工除錯用；loopback only
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

  # ─────────────────────────────────────────────────────────────────────────
  # pdf-publisher — 行程自動轉 PDF 發 Discord（2026-06-12，使用者需求：
  # #travel-planner 輸出行程時自動附 PDF）。確定性監看，不依賴 LLM 記得：
  # 輪詢 vault 的 Trips/*/itinerary.md → 變動就 md→HTML →（內部 HTTP 給
  # Steel 抓）→ /v1/pdf 真 Chrome 渲染（CJK 字型已驗證）→ PDF 存回 vault
  # ＋以 travel-claudebridge 身分上傳到頻道。詳見 pdf-publisher/publish.py。
  pdf-publisher:
    image: assistant-pdf-publisher:dev
    build:
      context: ./pdf-publisher
      dockerfile: Dockerfile
    container_name: pdf-publisher
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env   # DISCORD_TOKEN_TRAVEL_CLAUDE（上傳身分）
    environment:
      - CHANNEL_ID=1514819240631206072   # #travel-planner
    volumes:
      - "D:/discord 個人助理/TravelMemory:/vault"
      - assistant_pdfpub_state:/state    # 已發佈 hash — 重啟不重發
    depends_on:
      - steel-api
    # python:3.12-slim 沒有 pgrep；2026-08-27 docker top / /proc/1/cmdline
    # 實測 PID 1 = python -u /app/publish.py
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '/app/publish.py' /proc/1/cmdline && ls /vault >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # #url-intake Markdown → PDF。使用同一個 renderer image，但各自的 glob、
  # token、頻道與 state 完全分離；PDF 同時存入 Obsidian 的 URLIntake/PDF/。
  intake-publisher:
    image: assistant-pdf-publisher:dev
    build:
      context: ./pdf-publisher
      dockerfile: Dockerfile
    container_name: intake-publisher
    restart: unless-stopped
    env_file:
      - ../.local/discord_token.env
      - ../.local/cloudflare.env
    environment:
      CHANNEL_ID: "1536220007657373806"
      DISCORD_TOKEN_VAR: "DISCORD_TOKEN_NVIDIA"
      FILE_GLOB: "20??-??-??_????_*.md"
      PDF_SUBDIR: "PDF"
      PDF_FILENAME_TEMPLATE: "{stem}.pdf"
      DISCORD_FILENAME_TEMPLATE: "{stem}.pdf"
      MESSAGE_TEMPLATE: "📄 **{title}**（自動整理 PDF）"
      SELF_URL: "http://intake-publisher:8000"
      POLL_SECONDS: "10"
      RENDER_VERSION: "url-intake-a4-v1"
      ALLOW_STEEL_PDF_FALLBACK: "true"
    volumes:
      - "D:/discord 個人助理/URLIntake:/vault"
      - assistant_urlintake_pdfpub_state:/state
    depends_on:
      - steel-api
    # python:3.12-slim 沒有 pgrep；2026-08-27 docker top / /proc/1/cmdline
    # 實測 PID 1 = python -u /app/publish.py
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '/app/publish.py' /proc/1/cmdline && ls /vault >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — 全部沿用既有 volume（external），名稱含 aiquant_ 為歷史包袱。
# 新機器重建：docker volume create <name> 之後照各 SETUP 文件 bootstrap。
volumes:
  # pdf-publisher 的已發佈狀態（非 external — compose 自建，root 行程可寫）。
  assistant_pdfpub_state:
    name: assistant_pdfpub_state
  # URL intake 的 PDF 發佈 hash。
  assistant_urlintake_pdfpub_state:
    name: assistant_urlintake_pdfpub_state
  # A_struct 審核 bot 的獨立 Claude Pro state（非 external，compose 自建；首次 /login）。
  assistant_astruct_state:
    name: assistant_astruct_state
  # 聯徵報告 bot 的獨立 Codex/ChatGPT OAuth state（首次 chown + device auth）。
  assistant_creditreport_codex_state:
    name: assistant_creditreport_codex_state
  # 估價 bot 的 kiro state / AWS Builder ID 認證（非 external，compose 自建；
  # 首次啟動後須 chown 1000 再 device-flow 登入 — 見 ESTATE_SETUP.md）。
  # 舊的 assistant_estate_qwen_state 留著沒刪，退回 qwen 後端時可直接復用。
  assistant_estate_kiro_state:
    name: assistant_estate_kiro_state
  assistant_estate_kiro_auth:
    name: assistant_estate_kiro_auth
  assistant_estate_qwen_state:
    name: assistant_estate_qwen_state
  # travel-claude 的獨立 Pro 帳號 OAuth state（2026-06-12 與 host Max 帳號分家）。
  assistant_travelclaude_state:
    name: assistant_travelclaude_state
    external: true
  aiquant_kiro_state:
    name: aiquant_kiro_state
    external: true
  aiquant_kiro_auth:
    name: aiquant_kiro_auth
    external: true
  aiquant_nvidialab_qwen_state:
    name: aiquant_nvidialab_qwen_state
    external: true
  aiquant_travelnvidia_qwen_state:
    name: aiquant_travelnvidia_qwen_state
    external: true
  aiquant_steel_logs:
    name: aiquant_steel_logs
    external: true
  aiquant_steel_exports:
    name: aiquant_steel_exports
    external: true
  aiquant_steel_cache:
    name: aiquant_steel_cache
    external: true
